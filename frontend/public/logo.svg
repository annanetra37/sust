  <!-- Left bar -->
  <line x1="85" y1="48" x2="48" y2="125" stroke="url(#gl)" stroke-width="20" stroke-linecap="round"/>
  <!-- Right bar -->
  <line x1="115" y1="48" x2="152" y2="125" stroke="url(#gr)" stroke-width="20" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <line x1="58" y1="150" x2="142" y2="150" stroke="url(#gb)" stroke-width="20" stroke-linecap="round"/>
  <!-- Bottom-left dot -->
  <circle cx="38" cy="150" r="11" fill="#003700"/>
  <!-- Bottom-right dot -->
  <circle cx="162" cy="150" r="11" fill="#003700"/>
</svg>
