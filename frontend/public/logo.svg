<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gl" x1="0.5" y1="0" x2="0.5" y2="1" gradientTransform="rotate(-30)">
      <stop offset="0%" stop-color="#006600"/>
      <stop offset="45%" stop-color="#c8e6c8"/>
      <stop offset="100%" stop-color="#004400"/>
    </linearGradient>
    <linearGradient id="gr" x1="0.5" y1="0" x2="0.5" y2="1" gradientTransform="rotate(30)">
      <stop offset="0%" stop-color="#ddeedd"/>
      <stop offset="100%" stop-color="#003300"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ddeedd"/>
      <stop offset="50%" stop-color="#ccddcc"/>
